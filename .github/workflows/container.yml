name: container image

# Builds the image defined by the Dockerfile and pushes it to the GitHub Container Registry
# as ghcr.io/<owner>/<repository>:<tag> and :latest.
# Runs when a release is published. It can also be started by hand for an existing tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build, for example v1.0.0"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=${IMAGE}" >> "${GITHUB_ENV}"
          docker build \
            --tag "${IMAGE}:${TAG}" \
            --tag "${IMAGE}:latest" \
            --label "org.opencontainers.image.version=${TAG}" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            .

      - name: Push the image
        run: |
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
